name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check netlify/functions/auth.js
          node --check netlify/functions/publish.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline application script found');
          for (let i = 0; i < scripts.length; i++) {
            new Function(scripts[i][1]);
            console.log('Inline script ' + (i + 1) + ': syntax OK');
          }
          if (/const\s+ADMIN_PASSWORD\s*=|SSSIHL@2026/.test(html)) {
            throw new Error('A hard-coded admin password was found in index.html');
          }
          NODE
