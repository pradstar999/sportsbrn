name: Optimise PG gallery photos
on:
  push:
    branches: [main]
    paths:
      - 'assets/gallery/**'
      - 'scripts/optimise_pg_gallery.py'
      - '.github/workflows/optimise-pg-gallery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Convert PG photos to WebP
        run: python scripts/optimise_pg_gallery.py
      - name: Commit optimised images and manifest
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gallery assets/gallery-manifest.json
          git commit -m 'Optimise PG gallery images [skip ci]'
          git push
