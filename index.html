<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brindavan Sports Corner · SSSIHL</title>
<meta name="description" content="Fixtures, results, schedules, squads and photos from the SSSIHL Brindavan Campus sports meet.">
<meta name="theme-color" content="#0e1a3a">
<meta property="og:title" content="Brindavan Sports Corner">
<meta property="og:description" content="Live scores, schedules, results and photos: SSSIHL Brindavan Campus sports meet.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1a3a;--ink2:#16285c;--ink3:#1d357a;--paper:#f3f5ff;--hot:#ffd21f;--pink:#ff4d8d;--mint:#3ee0b0;
  --line:rgba(255,255,255,.16);--dim:rgba(255,255,255,.68);--h1:#ff5c5c;--h2:#4da3ff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--ink);color:#fff;font:400 16px/1.5 var(--body);min-height:100vh;display:flex;flex-direction:column}
/* Persistent cinematic background video: content stays above it; no poster transitions. */
#bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;background:var(--ink)}
#bg-shade{position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(5,12,30,.58)}
body>*:not(#bg-video):not(#bg-shade){position:relative;z-index:1}

button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:.95;font-weight:900}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--hot);color:var(--ink);padding:8px 12px;z-index:99}

.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(14,26,58,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font:900 22px/1 var(--display);text-decoration:none;white-space:nowrap}.logo span{color:var(--hot);margin-left:6px}
.bar nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.bar nav a{padding:8px 14px;border-radius:99px;color:var(--dim);text-decoration:none;font-weight:500;white-space:nowrap}
.bar nav a:hover{color:#fff;background:var(--ink2)}.bar nav a.on{background:var(--hot);color:var(--ink);font-weight:600}
.sbtn{padding:8px 14px;border:1px solid var(--line);border-radius:99px;color:var(--dim);font-size:14px}.sbtn:hover{color:#fff;border-color:#fff}

#app{flex:1}
.page{max-width:1200px;margin:auto;padding:40px 20px 72px}
.page h1{font-size:clamp(48px,8vw,104px);margin-bottom:10px}
.lede{color:var(--dim);max-width:58ch;margin-bottom:24px}
.h2{font-size:clamp(34px,5vw,56px);margin:48px 0 14px}
.crumb{font-size:14px;color:var(--dim);text-decoration:none;display:inline-block;margin-bottom:14px}.crumb:hover{color:#fff}

/* hero */
.hero{padding:44px 20px 24px;max-width:1200px;margin:auto}
.hero h1{font-size:clamp(60px,12vw,168px);text-wrap:balance}.hero h1 em{font-style:normal;color:var(--hot)}
.hero .sub{max-width:54ch;color:var(--dim);margin:14px 0 26px;font-size:18px}
.lanes{border-top:2px solid #fff;border-bottom:2px solid #fff}
.lane{display:grid;grid-template-columns:130px 1fr 70px;align-items:center;height:76px}
.lane+.lane{border-top:1px solid var(--line)}
.lane .nm{font:800 26px var(--display);padding-left:4px}
.lane .trk{position:relative;height:100%;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.1) 46px 48px)}
.lane .fin{position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-conic-gradient(#fff 0 25%,var(--ink) 0 50%) 0 0/14px 14px}
.lane .run{position:absolute;top:50%;left:0;transform:translateY(-50%);display:flex;align-items:center;gap:8px;padding:8px 16px 8px 10px;border-radius:99px;background:var(--c);color:#111;font:800 22px var(--display);transition:left 1.8s cubic-bezier(.2,.8,.2,1)}
.lane .run i{width:16px;height:16px;border-radius:50%;background:#111;opacity:.85}
.lane .pt{text-align:right;font:900 34px var(--display);padding-right:4px;font-variant-numeric:tabular-nums}
.nextrow{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:22px}
.next,.livebox{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:rgba(255,255,255,.04)}
.next h3,.livebox h3{font-size:22px;color:var(--hot);margin-bottom:6px}
.next .t{font:800 34px/1 var(--display)}.next .cd{font:800 28px var(--display);color:var(--mint);font-variant-numeric:tabular-nums;margin-top:6px}
.next small{color:var(--dim)}
.chip{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pink);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(1.5)}}
@media(max-width:760px){.nextrow{grid-template-columns:1fr}.lane{grid-template-columns:96px 1fr 52px;height:64px}.lane .nm{font-size:20px}}

/* cards */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.sc{position:relative;display:block;border-radius:18px;overflow:hidden;aspect-ratio:3/4;text-decoration:none;border:1px solid var(--line);background:var(--ink2)}
.sc .poster{position:absolute;inset:0;width:100%;height:100%}
.sc-b{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 14px;background:linear-gradient(transparent,rgba(6,10,26,.92))}
.sc h3{font-size:36px}.sc:hover{border-color:var(--hot)}
.sc .win.over{background:var(--dim);color:#fff}.overbadge{background:var(--dim)!important;color:#fff!important}.sc .win{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:var(--c);color:#111;font-weight:600;font-size:13px}
.soon{display:inline-block;margin-top:6px;color:var(--dim);font-size:13px}
img.poster,img.pl{object-fit:cover;display:block}
.ph{display:grid;place-items:center;text-align:center;color:var(--dim);font-size:13px;background:repeating-linear-gradient(135deg,var(--ink2) 0 14px,var(--ink3) 14px 28px);overflow:hidden}
.ph small{display:block;margin-top:4px;opacity:.75}
.ph .ini{font:900 48px var(--display);color:rgba(255,255,255,.55)}

.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.ev{display:block;text-decoration:none;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:6px 6px 0 var(--hot);transition:transform .15s,box-shadow .15s}
.ev:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--hot)}
.ev .th{height:120px;width:100%}.ev .b{padding:14px 16px 16px}
.ev h3{font-size:34px}.ev .k{font-size:13px;color:#4a5680;margin:3px 0 10px}
.ev .r{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #e0e4f7;padding:6px 0;font-size:14px}
.ev .none{color:#7a84ab;font-size:14px}.ev .r b{font-variant-numeric:tabular-nums}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chipb{padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);font-weight:600}
.chipb:hover{border-color:#fff}.chipb.on{background:var(--hot);color:var(--ink);border-color:var(--hot)}

/* detail */
.dhead{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:32px;align-items:start;margin-bottom:8px}
.dhead .poster{width:100%;height:auto;object-fit:contain;border-radius:18px;border:1px solid var(--line)}
.dhead .poster.ph{aspect-ratio:3/4}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.pair .poster{min-width:0}
.dhead.haspair{grid-template-columns:minmax(260px,600px) 1fr}
.sc .pair{position:absolute;inset:0;gap:2px;height:100%}
.sc .pair .poster{position:static;height:100%}
.sc img.poster.land{object-fit:contain;background:var(--ink2)}
.meta{color:var(--dim);margin-bottom:14px}
.score{display:flex;gap:18px;align-items:center;margin:16px 0}
.score div{font:900 72px/1 var(--display);color:var(--c)}
.score span{color:var(--dim);font-size:14px;display:block;font-family:var(--body);font-weight:500}
.rec{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--mint);color:var(--ink);font-weight:600;margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:14px;text-decoration:none;display:inline-block}
.btn:hover{border-color:#fff}.btn.solid{background:var(--hot);color:var(--ink);border-color:var(--hot)}
@media(max-width:700px){.dhead,.dhead.haspair{grid-template-columns:1fr}.dhead .poster{max-width:260px}.dhead .pair{max-width:none}.dhead .pair .poster{max-width:none}}

.fx{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:rgba(255,255,255,.04);max-width:640px}
.fx.live{border-color:var(--pink)}
.fx .m{font-size:13px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.side{display:flex;align-items:center;gap:10px;padding:4px 0}
.side .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}.side .t{flex:1;font-weight:600}
.side .s{font:800 24px var(--display)}.side.sc .win .t,.side.win .s{color:var(--hot)}
.tag{font-size:12px;background:var(--hot);color:var(--ink);border-radius:99px;padding:1px 8px;font-weight:600}
.badge{padding:2px 8px;border-radius:99px;background:var(--pink);font-weight:600;font-size:12px}
.badge.upcoming{background:var(--mint);color:var(--ink)}
.badge.final{background:var(--hot);color:var(--ink)}
.grp{font:800 24px var(--display);color:var(--hot);margin:18px 0 10px}

.squads{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:800px){.squads{grid-template-columns:1fr}}
.squad>h3{font-size:36px;color:var(--c);border-bottom:3px solid var(--c);padding-bottom:6px;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.pc{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--ink2);border-top:4px solid var(--c)}
.pc .pl{width:100%;aspect-ratio:3/4}.pc figcaption{padding:8px 10px;font-size:14px;line-height:1.3}
.pc figcaption span{display:block;color:var(--dim);font-size:12px}
.pc.empty{opacity:.55}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;font-size:13px;color:var(--dim);padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th.n,td.n{text-align:right}tr.first td{color:var(--hot);font-weight:600}
td .sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:8px}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:10px;display:inline-grid}
.av.ph{font-size:10px}.av.ph .ini{font-size:15px}
.tw{overflow-x:auto}
.empty{padding:26px;border:1.5px dashed var(--line);border-radius:14px;color:var(--dim);text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}@media(max-width:800px){.two{grid-template-columns:1fr}}

/* schedule */
.day{font:800 30px var(--display);margin:26px 0 8px;color:var(--hot)}
.row{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row.past{opacity:.5}.row .tm{font:800 22px var(--display)}
.row a.tt{font-weight:600;text-decoration:none}.row a.tt:hover{color:var(--hot)}
.row small{display:block;color:var(--dim)}
@media(max-width:600px){.row{grid-template-columns:70px 1fr}.row .btn{grid-column:2}}

/* gallery */
.gal{columns:3 240px;column-gap:12px}
.gal figure,.gal .ph{break-inside:avoid;margin:0 0 12px;border-radius:12px;overflow:hidden}
.gal figure{cursor:zoom-in;background:var(--ink2)}.gal img{display:block;width:100%;height:auto}
.gal .ph{aspect-ratio:4/3}
#lb,#sr{position:fixed;inset:0;z-index:50;display:none}#lb.on,#sr.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(6,10,26,.9);display:grid;place-items:center;padding:16px}
#lb img{max-width:94vw;max-height:82vh;border-radius:10px}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;padding:10px 16px;background:rgba(0,0,0,.5);border-radius:99px}
#lb .prev{left:12px}#lb .next{right:12px}#lb .x{position:absolute;top:14px;right:14px;padding:8px 14px;background:rgba(0,0,0,.5);border-radius:99px}
.sbox{width:min(560px,100%);align-self:start;margin-top:10vh;background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:18px}
.sbox input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);font-size:17px}
.sbox a{display:block;padding:10px 6px;border-bottom:1px solid var(--line);text-decoration:none}.sbox a:hover{color:var(--hot)}
.sbox small{color:var(--dim);display:block}
.authbox{max-width:460px;margin:10vh auto}.authbox .lock{font-size:48px;margin-bottom:8px}.authmsg{color:#ffb4b4;min-height:22px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--hot);color:var(--ink);padding:10px 18px;border-radius:99px;font-weight:600;z-index:60}
footer{padding:28px 20px;text-align:center;color:var(--dim);font-size:14px;border-top:1px solid var(--line)}
@media print{.bar,footer,.actions,.sbtn{display:none}body{background:#fff;color:#000}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

/* ===== 2026 visual refresh ===== */
:root{
  --bg:#070b18;--panel:#0d1530;--panel2:#111d3e;--white:#f8f9ff;
  --hot:#ffd21f;--pink:#ff4d8d;--mint:#3ee0b0;
  --line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.20);
  --violet:#c792ff;--sky:#4da3ff;--orange:#ff8c42;
  --gold:#ffd21f;--silver:#cbd3e6;--bronze:#e0a458;
  --cat-house:var(--hot);--cat-track:var(--sky);--cat-jumps:var(--mint);
  --cat-throws:var(--orange);--cat-racket:var(--violet);--cat-other:var(--pink);
}
body{background:
 radial-gradient(circle at 15% -10%,rgba(77,163,255,.16),transparent 32rem),
 radial-gradient(circle at 90% 12%,rgba(255,77,141,.12),transparent 28rem),
 var(--bg);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 75%);z-index:-1}
.bar{height:68px;padding:10px max(20px,calc((100vw - 1320px)/2));background:rgba(7,11,24,.82);border-bottom:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.12)}
.logo{font-size:25px;letter-spacing:.02em}.logo span{color:var(--hot);margin-left:4px}
.bar nav{justify-content:center;gap:2px}.bar nav a{padding:9px 14px;color:#9fa9c7;font-size:14px;transition:.2s}
.bar nav a:hover{background:rgba(255,255,255,.06);color:#fff}.bar nav a.on{background:#fff;color:var(--ink)}
.bar-actions{display:flex;gap:8px}.sbtn{padding:9px 14px;background:rgba(255,255,255,.04);border-color:var(--line2)}
.page{max-width:1320px;padding:52px 24px 90px}.hero{max-width:1320px;padding:58px 24px 26px}
.hero h1{font-size:clamp(72px,12vw,170px);letter-spacing:-.035em;max-width:900px}
.hero h1 em{color:transparent;-webkit-text-stroke:2px var(--hot);text-shadow:0 0 60px rgba(255,210,31,.08)}
.hero .sub{font-size:19px;max-width:66ch;color:#b6bfd9}
.hero:after{content:"2026—27";display:block;position:absolute;right:4vw;top:150px;font:900 clamp(80px,15vw,220px)/.8 var(--display);color:rgba(255,255,255,.025);pointer-events:none}
.lanes{background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.75);border-radius:18px;overflow:hidden}
.lane{height:82px;padding:0 18px;grid-template-columns:150px 1fr 72px}.lane+.lane{border-top-color:var(--line)}
.lane .nm{font-size:28px}.lane .pt{font-size:40px}.lane .run{box-shadow:0 8px 20px rgba(0,0,0,.18)}
.nextrow{grid-template-columns:1.4fr 1fr;margin-top:18px}.next,.livebox{border-color:var(--line);background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.025));box-shadow:0 15px 40px rgba(0,0,0,.14)}
.next h3,.livebox h3{font-size:24px}.next .t{font-size:40px}
.h2{margin-top:64px;letter-spacing:-.015em}.lede{color:#aeb8d3}
.sgrid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.sc{aspect-ratio:4/5;background:var(--panel);border-color:var(--line);box-shadow:0 18px 45px rgba(0,0,0,.16);transition:transform .25s,border-color .25s,box-shadow .25s}
.sc:after{content:"↗";position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);opacity:0;transition:.2s}
.sc:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.4);box-shadow:0 24px 55px rgba(0,0,0,.26)}.sc:hover:after{opacity:1}
.sc .poster{transition:transform .5s}.sc:hover .poster{transform:scale(1.04)}
.sc-b{padding:60px 18px 18px}.sc h3{font-size:40px}
.evgrid{gap:20px}.ev{border-color:transparent;box-shadow:8px 8px 0 var(--cc,var(--hot));transition:.2s}.ev:hover{box-shadow:11px 11px 0 var(--cc,var(--hot))}
.ev .th{height:150px}.ev h3{font-size:38px}.ev .k{color:var(--cc,#4a5680);font-weight:700}
.chips{gap:7px}.chipb{background:rgba(255,255,255,.03);border-color:var(--line2);transition:.2s}
.chipb.on{background:var(--cc,var(--hot));border-color:var(--cc,var(--hot));color:var(--ink);box-shadow:0 6px 18px rgba(255,210,31,.16)}
.fx{max-width:760px;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border-color:var(--line);box-shadow:0 12px 30px rgba(0,0,0,.1)}
.fx.live{border-color:var(--pink);box-shadow:0 0 0 1px rgba(255,77,141,.15),0 12px 30px rgba(255,77,141,.08)}
.squads{gap:34px}.pc{background:var(--panel);border-color:var(--line);transition:.2s}.pc:hover{transform:translateY(-3px);border-color:var(--line2)}
table{background:rgba(255,255,255,.025);border-radius:14px;overflow:hidden}th,td{padding:12px 14px}th{background:rgba(255,255,255,.035)}
.row{padding:15px 10px;border-bottom-color:var(--line)}.row:hover{background:rgba(255,255,255,.025)}
.btn{background:rgba(255,255,255,.03);border-color:var(--line2);transition:.2s}.btn:hover{background:rgba(255,255,255,.08);transform:translateY(-1px)}.btn.solid{box-shadow:0 8px 22px rgba(255,210,31,.12)}
.authbox{max-width:520px}.adminbox{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.15)}
.field input,.field select{background:rgba(0,0,0,.18);border-color:var(--line2);border-radius:10px;padding:10px 12px;width:100%}
.formgrid{gap:14px}
footer{background:rgba(0,0,0,.16);padding:34px 20px;border-top-color:var(--line)}
/* Home dashboard */
.homegrid{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:start}.dashpanel{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:20px;padding:22px}.dashpanel h3{font-size:30px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.kpi b{display:block;font:900 38px var(--display);color:#fff}.kpi span{font-size:12px;color:#8994b3;text-transform:uppercase;letter-spacing:.08em}

<script>const BASE = window.SITE;
// Admin credentials are verified by the Netlify function; never embed secrets in public assets.
const isAdmin = () => sessionStorage.getItem("sssihl-admin-auth") === "1";
const adminLogin = () => sessionStorage.setItem("sssihl-admin-auth","1");
const adminLogout = () => { sessionStorage.removeItem("sssihl-admin-auth"); location.hash="#/"; route(); };
const clone = o => JSON.parse(JSON.stringify(o));
const D = clone(BASE);
const sigOf = o => {let h=5381;const t=JSON.stringify([o.houseSports,o.individualEvents]);for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h};
const BASESIG = sigOf(BASE);
try {
  const raw = localStorage.getItem("sssihl-sports-data");
  let saved = JSON.parse(raw || "null");
  if(saved && saved.baseSig !== BASESIG){
    // data.js changed since this browser saved its copy: the site's data wins.
    // Keep the old copy under another key instead of deleting it.
    try{localStorage.setItem("sssihl-sports-data-set-aside",raw);localStorage.removeItem("sssihl-sports-data")}catch(e){}
    window.__staleSaved = true; saved = null;
  }
  if(saved && saved.houseSports && saved.individualEvents){
    D.houseSports = saved.houseSports; D.individualEvents = saved.individualEvents;
    // Posters always come from data.js, so a stale browser save can't hide new ones
    for(const k of ["houseSports","individualEvents"]) for(const o of D[k]){
      const b = BASE[k].find(x=>x.id===o.id);
      if(b){ delete o.poster; delete o.posterByDiv; if(b.poster) o.poster=b.poster; if(b.posterByDiv) o.posterByDiv=b.posterByDiv; }
    }
  }
} catch(e) { console.warn("Saved results could not be loaded", e); }
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const asset = p=>D.assetBase+p;
const H = id=>D.houses.find(h=>h.id===id)||{id,name:"TBD",color:"#8891b3"};
const allHouseSports = ()=>D.houseSports;
const sport = id=>allHouseSports().find(s=>s.id===id);
const event = id=>D.individualEvents.find(e=>e.id===id);
document.documentElement.style.setProperty("--h1",D.houses[0].color);
document.documentElement.style.setProperty("--h2",D.houses[1].color);
const ui = {cat:"All", sch:"All"};
let cdTimer=null, curGal=[];

/* ---------- division (UG / PG) — the whole site is scoped to one at a time ---------- */
function getDivision(){return sessionStorage.getItem("brn-division")||null}
function setDivision(d){sessionStorage.setItem("brn-division",d)}
function divName(d){return d==="UG"?"Undergraduate":"Postgraduate"}

/* ---------- data helpers ---------- */
const CAT_COLORS = {House:"var(--cat-house)",Track:"var(--cat-track)",Jumps:"var(--cat-jumps)",Throws:"var(--cat-throws)","Racket & Table":"var(--cat-racket)",Other:"var(--cat-other)"};
const catColor = cat=>CAT_COLORS[cat]||"var(--dim)";
const unit = ev=>(ev.metric==="distance"||ev.metric==="height")?" m":"";
function parseMark(s,metric){s=String(s).trim();if(metric==="time"&&s.includes(":")){const[m,r]=s.split(":");return +m*60+ +r}return parseFloat(s)}
function ranked(ev,div){
  return ev.results.filter(r=>(r.div||"All")===div||r.div==="All").filter(r=>r.place!=null||!isNaN(parseMark(r.mark,ev.metric))).sort((a,b)=>{
    if(a.place!=null&&b.place!=null)return a.place-b.place;
    if(a.place!=null)return -1; if(b.place!=null)return 1;
    const x=parseMark(a.mark,ev.metric),y=parseMark(b.mark,ev.metric);return ev.metric==="time"?x-y:y-x;
  });
}
function fixturesFor(sp,div){return sp.fixtures.filter(f=>f.div===div)}
function sportsFor(div){return allHouseSports().filter(sp=>fixturesFor(sp,div).length>0)}
function calc(div){
  const t={};D.houses.forEach(h=>t[h.id]={fix:0,W:0,L:0});
  sportsFor(div).forEach(sp=>fixturesFor(sp,div).forEach(f=>{
    if(f.status!=="final"||!(f.winner==="a"||f.winner==="b")||!t[f.a]||!t[f.b])return;
    const w=f.winner==="a"?f.a:f.b,l=f.winner==="a"?f.b:f.a;t[w].W++;t[w].fix+=D.points.fixtureWin;t[l].L++;
  }));
  return t;
}
function sportWinner(sp,div){const f=fixturesFor(sp,div).filter(f=>/final/i.test(f.round)&&f.status==="final"&&(f.winner==="a"||f.winner==="b")).pop();return f?H(f.winner==="a"?f.a:f.b):null}
function items(div){
  const out=[];
  sportsFor(div).forEach(sp=>fixturesFor(sp,div).forEach(f=>{if(f.date)out.push({cat:"House",title:`${sp.name}: ${H(f.a).name} vs ${H(f.b).name}`,round:f.round,date:f.date,time:f.time,venue:f.venue,link:`#/house/${sp.id}`,over:fxEffStatus(f)==="over"})}));
  D.individualEvents.forEach(ev=>ev.schedule.filter(s=>s.div===div).forEach(s=>{if(s.date)out.push({cat:ev.cat,title:ev.name,round:s.round,date:s.date,time:s.time,venue:s.venue,link:`#/individual/${ev.id}`,over:schedEffStatus(s)==="over"})}));
  out.forEach(o=>o.dt=slotDate(o));
  return out.sort((a,b)=>a.dt-b.dt);
}
function slotDate(s){return s.date?new Date(`${s.date}T${s.time||"00:00"}:00`):null}
function isPast(s){const d=slotDate(s);return d?d.getTime()<Date.now():false}
function fxEffStatus(f){if(f.status==="final")return "final";if(f.status==="live")return "live";return isPast(f)?"over":"upcoming"}
function schedEffStatus(s){return isPast(s)?"over":"upcoming"}
const fmtDay=d=>d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
const fmtTime=(d,t)=>t?d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}):"TBA";

/* ---------- images + placeholders ---------- */
const posterFiles=(o)=>{const v=(o.posterByDiv&&o.posterByDiv[getDivision()])||o.poster||o.id+".jpg";return Array.isArray(v)?v:[v]};
const posterUrl=(o)=>asset("posters/"+posterFiles(o)[0]);

/* ---------- gallery (numbered files 1.jpg, 2.jpg ...) ---------- */
const galCache={};
const test=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=u});
let galleryManifestPromise;
function loadGalleryManifest(){
  if(!galleryManifestPromise)galleryManifestPromise=fetch(asset("gallery-manifest.json"),{cache:"no-cache"})
    .then(r=>r.ok?r.json():{}).catch(()=>({}));
  return galleryManifestPromise;
}
function findPhotos(o){
  if(o.gallery&&o.gallery.length)return Promise.resolve(o.gallery.map(f=>asset(`gallery/${o.id}/${getDivision()}/${f}`)));
  const cacheKey=o.id+"-"+getDivision();
  return galCache[cacheKey]||(galCache[cacheKey]=(async()=>{
    const div=getDivision()||"UG";
    const manifest=await loadGalleryManifest();
    const files=manifest[o.id]||[];
    if(files.length)return files.map(f=>asset(`gallery/${o.id}/${f}`));
    const found=[],max=D.galleryMax||60;
    let prefix=`gallery/${o.id}/${div}/`;
    if(!await test(asset(prefix+"1.jpg")))prefix=`gallery/${o.id}/`;
    let i=1;
    while(i<=max){
      const batch=[...Array(8)].map((_,k)=>i+k).filter(n=>n<=max);
      const res=await Promise.all(batch.map(n=>test(asset(prefix+n+".jpg"))));
      for(let k=0;k<batch.length;k++){if(res[k])found.push(asset(prefix+batch[k]+".jpg"));else return found;}
      i+=8;
    }
    return found;
  })());
}

function matchDetail(f){
  const hs=[H(f.a),H(f.b)];let out="";
  const P=f.periods;
  if(P&&P.rows&&P.rows.length){
    const q=P.label==="Quarter",rows=P.rows;
    const line=(i,w)=>`<tr class="${f.winner===w?"w":""}"><td><span class="sw" style="--c:${hs[i].color}"></span> ${esc(hs[i].name)}</td>${rows.map(r=>`<td>${esc(r[i])}</td>`).join("")}${q?`<td class="tot">${esc(i?f.sb:f.sa)}</td>`:""}</tr>`;
    out+=`<div class="detail tw"><table class="ptable"><thead><tr><th></th>${rows.map((_,k)=>`<th>${q?"Q":esc(P.label||"Set")+" "}${k+1}</th>`).join("")}${q?"<th>Final</th>":""}</tr></thead><tbody>${line(0,"a")}${line(1,"b")}</tbody></table></div>`;
  }
  const S=f.scorers||{};
  const col=id=>{const l=S[id]||[];if(!l.length)return "";const h=H(id);return `<div class="scol"><h4><span class="sw" style="--c:${h.color}"></span>${esc(h.name)} scorers</h4>${l.map(x=>`<div class="srow"><span>${esc(x.name)}</span><b>${esc(x.pts)}</b></div>`).join("")}</div>`};
  if((S[f.a]||[]).length||(S[f.b]||[]).length)out+=`<div class="scorers">${col(f.a)}${col(f.b)}</div>`;
  return out;
}

function parseCSV(text){
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(inQ){
      if(c==='"'&&n==='"'){cell+='"';i++}
      else if(c==='"'){inQ=false}
      else cell+=c;
    } else {
      if(c==='"')inQ=true;
      else if(c===','){row.push(cell);cell=""}
      else if(c==='\r'){}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=""}
      else cell+=c;
    }
  }
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  if(!rows.length)return [];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>String(c).trim()!=="")).map(r=>{
    const o={};headers.forEach((h,i)=>o[h]=r[i]??"");return o;
  });
}
function normalizeRow(row){
  const o={};for(const k in row){const v=row[k];o[String(k).trim().toLowerCase()]=typeof v==="string"?v.trim():(v??"")}
  return o;
}
function inferType(row){
  if(row.type)return String(row.type).toLowerCase();
  if(row.sport&&row.house!==undefined&&row.event===undefined)return "player";
  if(row.sport!==undefined)return "house";
  return "individual";
}
function importIndividualRow(row){
  const ev=event((row.event||row.eventid||"").toLowerCase().trim())||D.individualEvents.find(e=>e.name.toLowerCase()===String(row.event||"").toLowerCase().trim());
  if(!ev)return {ok:false,reason:`unknown event "${row.event||""}"`};
  const name=(row.name||"").trim(),mark=(row.mark||row.result||"").trim();
  if(!name||!mark)return {ok:false,reason:"missing name or result"};
  const place=row.place?+row.place:null;
  const div=(row.div||"UG").toUpperCase();
  const round=row.round||"Final";
  ev.results=ev.results.filter(x=>!(place!=null&&x.place===place&&x.div===div&&(x.round||"Final")===round));
  ev.results.push({place,name,className:row.class||row.classname||"",regNo:row.regno||row["registration number"]||"",mark,div,round,photo:row.photo||""});
  return {ok:true};
}
function importHouseRow(row){
  const sp=sport((row.sport||row.sportid||"").toLowerCase().trim())||D.houseSports.find(s=>s.name.toLowerCase()===String(row.sport||"").toLowerCase().trim());
  if(!sp)return {ok:false,reason:`unknown sport "${row.sport||""}"`};
  const div=(row.div||"UG").toUpperCase();
  const round=row.round||"Final";
  const f={div,round,date:row.date||"",time:row.time||"",venue:row.venue||"",a:"bh",b:"ar",
    sa:String(row.bharathascore??row.bharathas??row.sa??""),sb:String(row.arjunascore??row.arjunas??row.sb??""),
    status:(row.status||"final").toLowerCase(),winner:(row.winner||"none").toLowerCase(),note:row.note||""};
  const idx=sp.fixtures.findIndex(x=>x.div===f.div&&x.round===f.round);
  if(idx>=0)sp.fixtures[idx]=f;else sp.fixtures.push(f);
  return {ok:true};
}
function importPlayerRow(row){
  const sp=sport((row.sport||row.sportid||"").toLowerCase().trim())||D.houseSports.find(s=>s.name.toLowerCase()===String(row.sport||"").toLowerCase().trim());
  if(!sp)return {ok:false,reason:`unknown sport "${row.sport||""}"`};
  const name=(row.name||"").trim();
  if(!name)return {ok:false,reason:"missing player name"};
  sp.players.push({name,house:(row.house||"bh").toLowerCase(),className:row.class||row.classname||"",regNo:row.regno||"",role:row.role||"",number:row.number||"",photo:row.photo||""});
  return {ok:true};
}
function importRows(rows){
  let okI=0,okH=0,okP=0;const errs=[];
  rows.forEach((raw,i)=>{
    const row=normalizeRow(raw);
    const type=inferType(row);
    const res=type==="house"||type==="fixture"?importHouseRow(row):type==="player"||type==="squad"?importPlayerRow(row):importIndividualRow(row);
    if(res.ok){if(type==="house"||type==="fixture")okH++;else if(type==="player"||type==="squad")okP++;else okI++}
    else errs.push(`Row ${i+2}: ${res.reason}`);
  });
  if(okI||okH||okP)saveData();
  route();
  const parts=[];
  if(okI)parts.push(okI+" individual result"+(okI===1?"":"s"));
  if(okH)parts.push(okH+" fixture"+(okH===1?"":"s"));
  if(okP)parts.push(okP+" player"+(okP===1?"":"s"));
  const summary=(parts.length?"Imported "+parts.join(", "):"Nothing imported")+(errs.length?` · ${errs.length} row(s) skipped`:"");
  toast(summary);
  showImportLog(summary,errs);
}
function showImportLog(summary,errs){
  const el=$("#importlog");if(!el)return;
  el.innerHTML=`<b>${esc(summary)}</b>`+(errs.length?"<br>"+errs.slice(0,20).map(esc).join("<br>"):"");
}
function importJsonSmart(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;
    try{data=JSON.parse(r.result)}catch(e){toast("Invalid JSON file");return}
    if(Array.isArray(data)){importRows(data);return}
    if(data&&data.houseSports&&data.individualEvents){
      D.houseSports=data.houseSports;D.individualEvents=data.individualEvents;saveData();route();
      const msg="Full results data replaced from backup file";toast(msg);showImportLog(msg,[]);
      return;
    }
    toast("Unrecognized JSON format");
  };
  r.readAsText(file);
}
let xlsxLoading=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  if(xlsxLoading)return xlsxLoading;
  return xlsxLoading=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js";
    s.onload=()=>res();s.onerror=()=>rej(new Error("Could not load Excel support — check your internet connection"));
    document.head.appendChild(s);
  });
}
function importFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".csv")){
    const r=new FileReader();
    r.onload=()=>{try{importRows(parseCSV(r.result))}catch(e){toast("Could not read that CSV file")}};
    r.readAsText(file);
  } else if(name.endsWith(".xlsx")||name.endsWith(".xls")){
    const r=new FileReader();
    r.onload=()=>{
      loadXLSX().then(()=>{
        try{
          const wb=XLSX.read(new Uint8Array(r.result),{type:"array"});
          const ws=wb.Sheets[wb.SheetNames[0]];
          importRows(XLSX.utils.sheet_to_json(ws,{defval:"",raw:false}));
        }catch(e){toast("Could not read that Excel file")}
      }).catch(e=>toast(e.message));
    };
    r.readAsArrayBuffer(file);
  } else if(name.endsWith(".json")){
    importJsonSmart(file);
  } else {
    toast("Unsupported file — use .csv, .xlsx or .json");
  }
}

function individualStandings(div){
  const pointsByPlace={1:5,2:3,3:1};
  const totals=new Map();
  D.individualEvents.filter(ev=>ev.id!=="10000m").forEach(ev=>(ev.results||[]).filter(r=>r.div===div).forEach(r=>{
    const place=Number(r.place),pts=pointsByPlace[place],name=String(r.name||"").trim();
    if(!pts||!name)return;
    const key=name.toLocaleLowerCase().replace(/\\s+/g," ");
    if(!totals.has(key))totals.set(key,{name:name,points:0,first:0,second:0,third:0,events:0});
    const a=totals.get(key);a.points+=pts;a.events++;
    if(place===1)a.first++;else if(place===2)a.second++;else if(place===3)a.third++;
  }));
  const rows=[...totals.values()].sort((a,b)=>b.points-a.points||b.first-a.first||b.second-a.second||a.name.localeCompare(b.name));
  const medal=n=>n===1?"gold":n===2?"silver":"bronze";
  const ordinal=n=>n===1?"1st":n===2?"2nd":n===3?"3rd":n+"th";
  const podium=rows.slice(0,3).map((a,i)=>({a:a,rank:i+1}));
  const podiumHtml=podium.length? '<div class="stand-podium">' + podium.map(({a,rank})=>
    '<article class="stand-pod '+medal(rank)+(rank===1?" champion":"")+'"><div class="stand-rank">'+(rank===1?"CHAMPION":ordinal(rank))+'</div>'+
    '<div class="stand-points">'+a.points+'<small>PTS</small></div><h3>'+esc(a.name)+'</h3>'+
    '<div class="stand-medals"><span>1st: '+a.first+'</span><span>2nd: '+a.second+'</span><span>3rd: '+a.third+'</span></div>'+
    '<small>'+a.events+' podium '+(a.events===1?"finish":"finishes")+'</small></article>').join("")+'</div>' : '<div class="empty">No individual podium results have been recorded for '+esc(div)+' yet.</div>';
  const table=rows.length? '<div class="stand-table-wrap"><table class="stand-table"><thead><tr><th>RANK</th><th>ATHLETE</th><th>1ST</th><th>2ND</th><th>3RD</th><th>EVENTS</th><th class="n">POINTS</th></tr></thead><tbody>'+
    rows.map((a,i)=>'<tr><td><span class="stand-position '+(i<3?medal(i+1):"")+'">'+String(i+1).padStart(2,"0")+'</span></td><td class="stand-name">'+esc(a.name)+'</td><td>'+a.first+'</td><td>'+a.second+'</td><td>'+a.third+'</td><td>'+a.events+'</td><td class="n"><strong class="stand-total">'+a.points+'</strong></td></tr>').join("")+'</tbody></table></div>' : "";
  return '<div class="page standings-page"><div class="stand-kicker">ANNUAL SPORTS MEET 2026–27 · '+esc(div)+' DIVISION</div>'+
    '<h1>INDIVIDUAL<br><em>STANDINGS.</em></h1><p class="lede">Every podium finish counts. Athletes earn <b>5 points for 1st</b>, <b>3 for 2nd</b>, and <b>1 for 3rd</b>. Totals update automatically from recorded individual-event results.</p>'+
    '<div class="stand-rule"><span>THE MEDAL RACE</span><span>'+rows.length+' ATHLETES SCORED</span></div>'+podiumHtml+
    '<div class="stand-table-head"><div><span class="stand-kicker">LEADERBOARD</span><h2 class="h2">Every point matters.</h2></div><div class="stand-key"><span><b>1st</b> +5</span><span><b>2nd</b> +3</span><span><b>3rd</b> +1</span></div></div>'+table+
    '<p class="stand-footnote">Scoring: 1st = 5 points · 2nd = 3 points · 3rd = 1 point. Only recorded individual-event results for the selected division count. Ties are ordered by number of 1st-place finishes, then 2nd-place finishes.</p></div>';
}

  ${resultsBlock(ev,r)}
  ${(ev.matches||[]).some(m=>m.div===div)?`<h2 class="h2">Match results</h2><div class="matches">${ev.matches.filter(m=>m.div===div).map(matchCard).join("")}</div>`:""}
  <h2 class="h2">Schedule</h2>${sched.length?`<div class="tw"><table><thead><tr><th>Round</th><th>Date</th><th>Time</th><th>Venue</th><th>Status</th></tr></thead><tbody>${sched.map(s=>{const d=slotDate(s),past=isPast(s);return `<tr><td>${esc(s.round)}</td><td>${d?esc(fmtDay(d)):"TBA"}</td><td>${d?esc(fmtTime(d,s.time)):"TBA"}</td><td>${esc(s.venue||"TBA")}</td><td>${past?'<span class="badge overbadge">OVER</span>':'<span class="badge upcoming">Upcoming</span>'}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty">No scheduled event for ${esc(div)}.</div>`}
  ${galleryBlock(ev)}</div>`;
}
function schedulePage(div){
  const cats=["All","House",...new Set(D.individualEvents.map(e=>e.cat))];
  return `<div class="page"><h1>Schedule — ${div}</h1><p class="lede">Every ${esc(divName(div).toLowerCase())} fixture and event slot, day by day. Tap Add to calendar to save one.</p>
  <div class="chips" id="schcats">${cats.map(c=>`<button class="chipb ${c===ui.sch?"on":""}" ${c!=="All"?`style="--cc:${catColor(c)}"`:""} data-sch="${esc(c)}">${esc(c==="House"?"House events":c)}</button>`).join("")}</div><div id="schlist">${schedList(div)}</div></div>`;
}
function schedList(div){
  const now=new Date(),list=items(div).filter(i=>ui.sch==="All"||i.cat===ui.sch);
  if(!list.length)return `<div class="empty">The schedule will be published here soon.</div>`;
  let day="",out="";
  list.forEach(i=>{const d=fmtDay(i.dt);if(d!==day){day=d;out+=`<div class="day">${esc(d)}</div>`}
    const over=i.dt<now;
    out+=`<div class="row ${over?"past":""}"><div class="tm">${esc(fmtTime(i.dt,i.time))}</div><div><a class="tt" href="${i.link}">${esc(i.title)}</a><small>${[i.round,i.venue].filter(Boolean).map(esc).join(" · ")}</small></div>${over?'<span class="badge overbadge">OVER</span>':`<button class="btn" data-ics="${i.dt.getTime()}|${esc(i.title+(i.round?" - "+i.round:""))}|${esc(i.venue||"")}">Add to calendar</button>`}</div>`});
  return out;
}
const notFound=()=>`<div class="page"><h1>Not found</h1><p class="lede">That page does not exist.</p><a class="btn solid" href="#/">Back to home</a></div>`;

/* ---------- division chooser gate ---------- */
function gatePage(){
  return `<div class="page gatepage"><h1>Choose your championship</h1><p class="lede">Bharathas and Arjunas compete separately in the Undergraduate and Postgraduate divisions — pick one to continue. You can switch anytime from the header.</p>
  <div class="divgate">
    <button class="divcard ug" data-choose="UG"><h2>UG</h2><span>Undergraduate championship</span></button>
    <button class="divcard pg" data-choose="PG"><h2>PG</h2><span>Postgraduate championship</span></button>
  </div></div>`;
}

/* ---------- router ---------- */
function route(){
  const div=getDivision();
  renderSwitcher(div);
  if(!div && location.hash.replace(/^#\/?/,"").split("/")[0]!=="admin"){
    $("#app").innerHTML=gatePage();document.title="Choose division · SSSIHL Brindavan";
    document.querySelectorAll("#nav a").forEach(l=>l.classList.remove("on"));
    return;
  }
  const [a,b]=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  clearInterval(cdTimer);let html,title=D.name;
  if(!a)html=home(div);
  else if(a==="house"&&!b){html=houseList(div);title="House events"}
  else if(a==="house"){const s=sport(b);html=s?sportPage(s,div):notFound();if(s)title=s.name}
  else if(a==="individual"&&!b){html=indList(div);title="Individual events"}
  else if(a==="individual"){const e=event(b);html=e?eventPage(e,div):notFound();if(e)title=e.name}
  else if(a==="standings"){html=individualStandings(div);title="Individual standings"}
  else if(a==="reflections"){html=reflectionsPage(div);title="Oath & Reflections"}
  else if(a==="schedule"){html=schedulePage(div);title="Schedule"}
  else if(a==="admin"){html=adminPage();title=isAdmin()?"Admin":"Admin access"}
  else html=notFound();
  $("#app").innerHTML=html;document.title=title+(a?" · ":" · ")+"SSSIHL Brindavan";
  document.querySelectorAll("#nav a").forEach(l=>l.classList.toggle("on",l.dataset.r===(a||"")));
  scrollTo(0,0);animateLanes();initGalleries();startCd();
}
function renderSwitcher(div){
  const el=$("#divswitch");if(!el)return;
  if(!div){el.innerHTML="";return}
  el.innerHTML=["UG","PG"].map(d=>`<button class="divbtn ${d===div?"on":""}" data-switchdiv="${d}">${d}</button>`).join("");
}
function startCd(){
  const el=$("[data-cd]");if(!el)return;
  const tick=()=>{let s=Math.max(0,Math.floor((+el.dataset.cd-Date.now())/1000));const d=Math.floor(s/86400);s%=86400;
    const h=Math.floor(s/3600),m=Math.floor(s%3600/60);el.textContent=(d?d+"d ":"")+String(h).padStart(2,"0")+"h "+String(m).padStart(2,"0")+"m "+String(s%60).padStart(2,"0")+"s"};
  tick();cdTimer=setInterval(tick,1000);
}
addEventListener("hashchange",route);

/* ---------- search ---------- */
function searchIndex(){
  const div=getDivision()||"UG";
  const r=[];
  sportsFor(div).forEach(sp=>{r.push({t:sp.name,s:"House event",l:`#/house/${sp.id}`});sp.players.forEach(p=>r.push({t:p.name,s:`${sp.name} · ${H(p.house).name}`,l:`#/house/${sp.id}`}))});
  D.individualEvents.forEach(ev=>{r.push({t:ev.name,s:"Individual event · "+ev.cat,l:`#/individual/${ev.id}`})});
  return r;
}
function openSearch(){
  $("#sr").innerHTML=`<div class="scrim" data-srx><div class="sbox"><input id="q" placeholder="Search sports, events, players..." autocomplete="off" aria-label="Search"><div id="qr"></div></div></div>`;
  $("#sr").classList.add("on");const idx=searchIndex(),q=$("#q");q.focus();
  q.oninput=()=>{const v=q.value.trim().toLowerCase();const hits=v?idx.filter(x=>x.t.toLowerCase().includes(v)).slice(0,12):[];
    $("#qr").innerHTML=v?(hits.length?hits.map(x=>`<a href="${x.l}" data-srx>${esc(x.t)}<small>${esc(x.s)}</small></a>`).join(""):`<p class="meta" style="margin:12px 0 0">No matches.</p>`):""};
}
const closeSearch=()=>{$("#sr").classList.remove("on");$("#sr").innerHTML=""};

/* ---------- misc actions ---------- */
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function icsFile(ms,title,venue){
  const f=d=>{const p=n=>String(n).padStart(2,"0");return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00"};
  const s=new Date(+ms),e=new Date(+ms+3600000);
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SSSIHL BRN Sports//EN","BEGIN:VEVENT","UID:"+ms+"@sssihl-brn-sports","DTSTAMP:"+f(new Date()),"DTSTART:"+f(s),"DTEND:"+f(e),"SUMMARY:"+title.replace(/[,;]/g," "),"LOCATION:"+venue.replace(/[,;]/g," "),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));a.download=slug(title)+".ics";a.click();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-cat],[data-sch],[data-lb],[data-lbn],[data-lbx],[data-copy],[data-ics],[data-srx],[data-admin],[data-choose],[data-switchdiv]");if(!t)return;const d=t.dataset;
  if(d.choose){setDivision(d.choose);route();return}
  if(d.switchdiv){setDivision(d.switchdiv);location.hash="#/";route();toast("Switched to "+d.switchdiv);return}
  if(d.admin && !isAdmin() && !["login"].includes(d.admin)){ if(d.admin!=="logout") location.hash="#/admin"; return; }
  if(d.srx!==undefined){if(t.tagName==="A"||e.target===t)closeSearch();return}
  if(d.cat){ui.cat=d.cat;$("#cats").querySelectorAll(".chipb").forEach(b=>b.classList.toggle("on",b.dataset.cat===d.cat));$("#evgrid").innerHTML=indGrid(getDivision())}
  else if(d.sch){ui.sch=d.sch;$("#schcats").querySelectorAll(".chipb").forEach(b=>b.classList.toggle("on",b.dataset.sch===d.sch));$("#schlist").innerHTML=schedList(getDivision())}
  else if(d.lb!==undefined)openLb(+d.lb);
  else if(d.lbn){openLb.i=(openLb.i+ +d.lbn+curGal.length)%curGal.length;openLb(openLb.i)}
  else if(d.lbx!==undefined||t.classList.contains("scrim")){$("#lb").classList.remove("on");$("#lb").innerHTML=""}
  else if(d.copy!==undefined){(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>toast("Link copied"),()=>toast("Copy the link from the address bar"))}
  else if(d.ics){const [ms,title,venue]=d.ics.split("|");icsFile(ms,title,venue)}
  else if(d.admin==="add-ind"){
    const ev=event($("#ir-event").value); const place=+$("#ir-place").value; const name=$("#ir-name").value.trim(); const mark=$("#ir-mark").value.trim();
    if(!ev||!name||!mark){toast("Enter event, name and result");return}
    const div=$("#ir-div").value;
    ev.results=ev.results.filter(x=>!(x.place===place && x.div===div));
    ev.results.push({place,name,className:$("#ir-class").value.trim(),regNo:$("#ir-reg").value.trim(),mark,div,round:$("#ir-round").value.trim()||"Final",photo:$("#ir-photo").value.trim()});
    saveData();route();
  }
  else if(d.admin==="add-fixture"){
    const sp=sport($("#hr-sport").value); if(!sp)return;
    const winner=$("#hr-winner").value;
    const f={div:$("#hr-div").value,round:$("#hr-round").value.trim()||"Final",date:$("#hr-date").value,time:$("#hr-time").value,venue:$("#hr-venue").value.trim(),a:"bh",b:"ar",sa:$("#hr-bh").value.trim(),sb:$("#hr-ar").value.trim(),status:$("#hr-status").value,winner,note:$("#hr-note").value.trim()};
    const idx=sp.fixtures.findIndex(x=>x.div===f.div&&x.round===f.round); if(idx>=0)sp.fixtures[idx]=f; else sp.fixtures.push(f); saveData();route();
  }
  else if(d.admin==="add-player"){
    const sp=sport($("#pl-sport").value),name=$("#pl-name").value.trim();if(!sp||!name){toast("Enter sport and player name");return}
    sp.players.push({name,house:$("#pl-house").value,className:$("#pl-class").value.trim(),regNo:$("#pl-reg").value.trim(),role:$("#pl-role").value.trim(),number:$("#pl-number").value.trim(),photo:$("#pl-photo").value.trim()});saveData();route();
  }
  else if(d.admin==="publish")publishSite();
  else if(d.admin==="export-js")downloadData();
  else if(d.admin==="export-json")downloadJson();
  else if(d.admin==="tmpl-individual")downloadCsvTemplate("individual");
  else if(d.admin==="tmpl-house")downloadCsvTemplate("house");
  else if(d.admin==="tmpl-player")downloadCsvTemplate("player");
  else if(d.admin==="reset")resetSaved();
  else if(d.admin==="logout")adminLogout();
});

document.addEventListener("submit",async e=>{
  if(e.target.id!=="admin-login-form")return;
  e.preventDefault();
  const form=e.target;
  const user=$("#admin-user").value.trim();
  const pass=$("#admin-pass").value;
  const msg=form.querySelector(".authmsg");
  const submit=form.querySelector('button[type="submit"]');
  submit.disabled=true;
  msg.textContent="Verifying credentials…";
  try{
    const response=await fetch("/.netlify/functions/auth",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:user,password:pass})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||"Sign-in failed. Please try again.");
    sessionStorage.setItem("sssihl-publish-pw",pass);
    adminLogin();
    route();
    toast("Admin access granted");
  }catch(err){
    msg.textContent=err.message||"Could not verify credentials. Check your connection and try again.";
    $("#admin-pass").select();
  }finally{submit.disabled=false;}
});
$("#lb").addEventListener("click",e=>{if(e.target.classList.contains("scrim")){$("#lb").classList.remove("on");$("#lb").innerHTML=""}});
$("#sbtn").onclick=openSearch;
addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeSearch();$("#lb").classList.remove("on")}
  if($("#lb").classList.contains("on")&&curGal.length){if(e.key==="ArrowRight"){openLb((openLb.i+1)%curGal.length)}if(e.key==="ArrowLeft"){openLb((openLb.i-1+curGal.length)%curGal.length)}}
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();openSearch()}
});
$("#foot").textContent=`${D.campus} · Sports Corner · Updated ${D.updated}`;
if(window.__staleSaved)setTimeout(()=>toast("Site results were updated. Older unpublished changes in this browser were set aside."),800);
document.addEventListener("change",e=>{if(e.target.id==="import-file"&&e.target.files[0])importFile(e.target.files[0])});
document.addEventListener("click",e=>{if(e.target.closest("#dropzone"))$("#import-file")?.click()});
document.addEventListener("dragover",e=>{if(e.target.closest("#dropzone")){e.preventDefault();$("#dropzone").classList.add("drag")}});
document.addEventListener("dragleave",e=>{if(e.target.closest("#dropzone"))$("#dropzone").classList.remove("drag")});
document.addEventListener("drop",e=>{const z=e.target.closest("#dropzone");if(!z)return;e.preventDefault();z.classList.remove("drag");const f=e.dataTransfer.files[0];if(f)importFile(f)});
route();

/* Lightweight progressive enhancement: scroll-to-top, motion preference and reveal effects */
(function(){
  if(!document.getElementById("to-top")){
    const b=document.createElement("button");
    b.id="to-top";b.type="button";b.setAttribute("aria-label","Back to top");b.title="Back to top";b.textContent="↑";
    document.body.appendChild(b);
    b.addEventListener("click",()=>window.scrollTo({top:0,behavior:document.body.classList.contains("motion-off")?"auto":"smooth"}));
    const update=()=>b.classList.toggle("show",window.scrollY>420);
    window.addEventListener("scroll",update,{passive:true});update();
  }
  const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduced)document.body.classList.add("motion-off");
  // Use event delegation because the app redraws its page content during navigation.
  const observe=()=>{
    document.querySelectorAll("#app .page > *,#app .hero > *,#app .quick,#app .sc,#app .fx,#app .kpi").forEach((el,i)=>{
      if(el.dataset.motionReady)return;
      el.dataset.motionReady="1";
      if(!reduced){el.style.animation="reveal-up .42s "+Math.min(i*28,220)+"ms both";}
    });
  };
  const app=document.getElementById("app");
  if(app&&window.MutationObserver){
    new MutationObserver(()=>requestAnimationFrame(observe)).observe(app,{childList:true,subtree:true});
  }
  observe();
  document.addEventListener("keydown",e=>{
    if(e.key==="Home"&&e.target===document.body)window.scrollTo({top:0,behavior:reduced?"auto":"smooth"});
  });
})();

</script>
